           VARIABLES

        ========================= */

            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

            color: var(--dark);

            line-height: 1.7;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            height: 80px;
            display: flex;r5rewr
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid var(--border);

            background: rgba(247, 242, 233, 0.96);

            position: sticky;
            top: 0;

            z-index: 50;
        }


        .logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 27px;

            color: var(--burgundy);

            letter-spacing: 1px;
        }


        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }


        nav a {
            color: var(--dark);

            text-decoration: none;

            font-size: 13px;

            letter-spacing: 1px;

            text-transform: uppercase;

            transition: color 0.2s ease;
        }


        nav a:hover {
            color: var(--burgundy);
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .gallery-header {
            padding: 110px 9% 80px;

            text-align: center;

            background: var(--paper);

            border-bottom: 1px solid var(--border);
        }


        .eyebrow {
            text-transform: uppercase;

            color: var(--gold);

            letter-spacing: 4px;

            font-size: 12px;

            margin-bottom: 20px;
        }


        .gallery-header h1 {
            font-family: "Cormorant Garamond", serif;

            font-weight: 500;

            font-size: clamp(60px, 8vw, 100px);

            line-height: 0.9;

            color: var(--burgundy);

            margin-bottom: 25px;
        }


        .gallery-header p {
            max-width: 650px;

            margin: auto;

            color: var(--muted);

            font-size: 17px;
        }


        /* =========================
           BACK LINK
        ========================= */

        .back-link-wrapper {
            max-width: 1200px;

            margin: auto;

            padding: 30px 7% 0;
        }


        .back-link {
            display: inline-flex;

            align-items: center;

            gap: 10px;

            color: var(--burgundy);

            text-decoration: none;

            font-family: "DM Mono", monospace;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;

            transition: transform 0.2s ease;
        }


        .back-link:hover {
            transform: translateX(-4px);
        }


        /* =========================
           GALLERY CONTAINER
        ========================= */

        .gallery-container {
            max-width: 1200px;

            margin: auto;

            padding: 60px 7% 120px;
        }


        /* =========================
           PHOTO GRID
        ========================= */

        .photo-grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 25px;
        }


        /* =========================
           PHOTO CARD
        ========================= */

        .photo-card {
            background: var(--paper);

            border: 1px solid var(--border);

            overflow: hidden;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .photo-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 15px 35px rgba(36, 33, 31, 0.09);
        }


        /* =========================
           PHOTO
        ========================= */

        .photo-image {
            height: 360px;

            overflow: hidden;

            background: var(--cream);
        }


        .photo-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition: transform 0.5s ease;
        }


        .photo-card:hover .photo-image img {
            transform: scale(1.04);
        }


        /* =========================
           PHOTO NUMBER
        ========================= */

        .photo-number {
            padding: 15px 20px;

            border-top: 1px solid var(--border);

            font-family: "DM Mono", monospace;

            font-size: 9px;

            letter-spacing: 1.5px;

            color: var(--gold);

            text-transform: uppercase;
        }


        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;

            inset: 0;

            background: rgba(24, 20, 18, 0.94);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px;

            z-index: 100;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;
        }


        .lightbox.active {
            opacity: 1;

            visibility: visible;
        }


        .lightbox-content {
            max-width: 1100px;

            max-height: 90vh;

            position: relative;

            text-align: center;
        }


        .lightbox img {
            max-width: 100%;

            max-height: 78vh;

            display: block;

            margin: auto;

            object-fit: contain;
        }


        .lightbox-caption {
            color: white;

            margin-top: 15px;

            font-family: "Cormorant Garamond", serif;

            font-size: 24px;
        }


        .lightbox-close {
            position: fixed;

            top: 25px;

            right: 35px;

            background: none;

            border: none;

            color: white;

            font-size: 35px;

            cursor: pointer;

            font-family: Arial, sans-serif;
        }


        .lightbox-close:hover {
            color: #d8bd8a;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: var(--dark);

            color: white;

            padding: 60px 9%;

            text-align: center;
        }


        footer h2 {
            font-family: "Cormorant Garamond", serif;

            font-size: 35px;
        }


        footer p {
            color: #aaa;

            margin-top: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

            nav ul {
                display: none;
            }


            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 550px) {

            .gallery-header {
                padding: 80px 7% 60px;
            }


            .photo-grid {
                grid-template-columns: 1fr;
            }


            .photo-image {
                height: 330px;
            }


            .gallery-container {
                padding-top: 40px;
            }

        }

/*
 * ==========================================
 * LIGHTBOX
 * ==========================================
 */
const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxCaption =
    document.getElementById("lightboxCaption");

const lightboxClose =
    document.getElementById("lightboxClose");


function openLightbox(image, caption) {

    lightboxImage.src = image;
    lightboxImage.alt = caption;
    lightboxCaption.textContent = caption;

    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
}


function closeLightbox() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
}


/*
 * Close using X
 */
lightboxClose.addEventListener(
    "click",
    closeLightbox
);


/*
 * Close by clicking outside
 * the photograph.
 */
lightbox.addEventListener("click", (event) => {

    if (event.target === lightbox) {
        closeLightbox();
    }

});


/*
 * Close using Escape key.
 */
document.addEventListener("keydown", (event) => {

    if (event.key === "Escape") {
        closeLightbox();
    }

});
